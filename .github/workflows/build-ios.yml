name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Patch Podfile
        run: node scripts/patch-podfile.js

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          export NODE_BINARY="$(command -v node)"
          cd ios
          if [ -f .xcode.env.local ]; then source .xcode.env.local; elif [ -f .xcode.env ]; then source .xcode.env; fi
          npx pod-install --repo-update --silent

      - name: Prebuild Pods for Release
        shell: bash
        run: |
          set -euo pipefail
          export NODE_BINARY="$(command -v node)"
          cd ios
          if [ -f .xcode.env.local ]; then source .xcode.env.local; elif [ -f .xcode.env ]; then source .xcode.env; fi

          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 2 | head -1)
          if [ -z "$WORKSPACE" ]; then echo "FATAL: no .xcworkspace found"; exit 1; fi

          # Dump all schemes for debugging
          echo "=== available schemes (json) ==="
          SCHEMES_JSON=$(xcodebuild -workspace "$WORKSPACE" -list -json)
          echo "$SCHEMES_JSON"

          # Search workspace + projects for any scheme containing 'Pods'
          PODS_SCHEME=$(echo "$SCHEMES_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); s=[]; s+=d.get('workspace',{}).get('schemes',[]) or []; [s.extend(p.get('schemes',[]) or []) for p in d.get('projects',[])]; pods=[x for x in s if 'Pods' in x]; print(pods[0] if pods else '')")
          if [ -z "$PODS_SCHEME" ]; then
            echo "FATAL: No Pods scheme found in workspace or projects"
            exit 1
          fi

          echo "Prebuilding: $PODS_SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$PODS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tail -100

      - name: Archive and create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          export NODE_BINARY="$(command -v node)"
          cd ios
          if [ -f .xcode.env.local ]; then source .xcode.env.local; elif [ -f .xcode.env ]; then source .xcode.env; fi

          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 2 | head -1)
          echo "Workspace: $WORKSPACE"
          if [ -z "$WORKSPACE" ]; then echo "FATAL: no .xcworkspace found"; exit 1; fi

          WSNAME=$(basename "$WORKSPACE" .xcworkspace)
          echo "=== available schemes ==="
          xcodebuild -workspace "$WORKSPACE" -list || true
          SCHEMES_JSON=$(xcodebuild -workspace "$WORKSPACE" -list -json)

          if [ -n "${SCHEME:-}" ]; then
            echo "Using SCHEME from environment: $SCHEME"
          else
            SCHEME=$(echo "$SCHEMES_JSON" | python3 -c "import sys,json,os; d=json.load(sys.stdin); s=[]; s+=d.get('workspace',{}).get('schemes',[]) or []; for p in d.get('projects',[]): s+=p.get('schemes',[]) or []; w=os.environ.get('WSNAME',''); m=[x for x in s if x==w]; n=[x for x in s if 'Pods' not in x and x!=w]; print(m[0] if m else (n[0] if n else (s[0] if s else '')))")
            echo "Selected scheme: $SCHEME"
          fi
          if [ -z "$SCHEME" ]; then echo "FATAL: no scheme selected"; exit 1; fi

          echo "=== Podfile ==="
          cat Podfile

          ARCHIVE="/tmp/app.xcarchive"
          LOG="$RUNNER_TEMP/xcodebuild.log"
          set +o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee "$LOG"
          BUILD_EXIT=${PIPESTATUS[0]}
          set -o pipefail

          echo "=== archive tree (depth 3) ==="
          find "$ARCHIVE" -maxdepth 3 -type d 2>/dev/null || true
          echo "=== searching for .app ==="
          find "$ARCHIVE" -name "*.app" -type d 2>/dev/null || true

          APP=$(find "$ARCHIVE" -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "FATAL: .app not found in archive"
            echo "=== compiler errors ==="
            grep -i "error:" "$LOG" | head -30 || true
            echo "=== last 200 lines ==="
            tail -n 200 "$LOG" || true
            exit 1
          fi

          APP_NAME=$(basename "$APP")
          IPA_NAME="${APP_NAME%.app}.ipa"
          echo "Found: $APP_NAME -> IPA: $IPA_NAME"

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r "$IPA_NAME" Payload/
          cp "$IPA_NAME" "$PWD/../$IPA_NAME"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: "*.ipa"
