name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Build and export unsigned IPA
        shell: bash
        run: |
          set -eo pipefail
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)
          echo "Workspace: $WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c "import sys,json; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "Scheme: $SCHEME"

          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            clean archive \
            -archivePath app.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          echo "=== Archive structure ==="
          find app.xcarchive -maxdepth 3 -type d

          APP=$(find app.xcarchive/Products/Applications -name "*.app" -maxdepth 1 -type d | head -1)
          echo "App: '$APP'"

          if [ -z "$APP" ]; then
            echo "FATAL: no .app in Products/Applications"
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r genius-finance.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: genius-finance-unsigned.ipa
          path: ios/genius-finance.ipa
