name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned archive
        shell: bash
        run: |
          set -eo pipefail
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 -not -name "*.xcodeproj" | head -1)
          echo "Workspace: $WORKSPACE"
          xcodebuild -workspace "$WORKSPACE" -list
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c "import sys,json; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "Scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/app.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -destination 'generic/platform=iOS'
          echo "Archive done, listing contents:"
          ls -la build/app.xcarchive/Products/Applications/

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -eo pipefail
          APP=$(find ios/build/app.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r genius-finance.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: genius-finance-unsigned.ipa
          path: genius-finance.ipa
