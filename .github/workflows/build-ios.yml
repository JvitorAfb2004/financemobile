name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned app
        shell: bash
        run: |
          set -eo pipefail
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)
          echo "Workspace: $WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c "import sys,json; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "Scheme: $SCHEME"

          BUILD_DIR="$PWD/build/output"
          mkdir -p "$BUILD_DIR"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""

          echo "=== Build output ==="
          ls -la "$BUILD_DIR/"

          APP=$(find "$BUILD_DIR" -name "*.app" -maxdepth 1 -type d | head -1)
          echo "App: '$APP'"

          if [ -z "$APP" ]; then
            echo "Searching derived data..."
            APP=$(find "$PWD/build" -name "*.app" -type d -not -path "*/Previews/*" | head -1)
            echo "DerivedData app: '$APP'"
          fi

          if [ -z "$APP" ]; then
            echo "FATAL: could not find .app"
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r ../genius-finance.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: genius-finance-unsigned.ipa
          path: genius-finance.ipa
