name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Archive and create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)
          echo "Workspace: $WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c "import sys,json; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "Scheme: $SCHEME"

          if [ -f .xcode.env.local ]; then source .xcode.env.local; elif [ -f .xcode.env ]; then source .xcode.env; fi
          export NODE_BINARY

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/app.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            ONLY_ACTIVE_ARCH=NO

          echo "=== Archive Products/Applications ==="
          ls -la ../build/app.xcarchive/Products/Applications/

          APP_PATH=$(find ../build/app.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "FATAL: no .app in archive"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH")
          IPA_NAME="${APP_NAME%.app}.ipa"
          echo "App: $APP_NAME -> IPA: $IPA_NAME"

          mkdir -p ../build/ipa/Payload
          cp -r "$APP_PATH" ../build/ipa/Payload/
          cd ../build/ipa
          zip -r "$IPA_NAME" Payload

          cp "$IPA_NAME" "../../$IPA_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: "*.ipa"
